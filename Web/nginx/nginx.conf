
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    map $http_connection $connection_upgrade {
        "~*Upgrade" $http_connection;
        default keep-alive;
    }

    
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;    

    upstream application {
        # https://learn.microsoft.com/en-us/aspnet/core/signalr/scale?view=aspnetcore-7.0#linux-with-nginx
        # Sticky Sessions is required for SignalR, unmark ip_hash for enable Sticky Sessions
        
        #ip_hash;
        hash $http_cookie_hash consistent;
        server redis_sample-ap1-1:8080;
        server redis_sample-ap2-1:8080;
    }

    server {
        listen  80;

        # proxy_http_version 1.1;
        # proxy_set_header   Upgrade $http_upgrade;
        # proxy_set_header   Connection $connection_upgrade;
        # proxy_set_header   Host $host;
        # proxy_cache_bypass $http_upgrade;

        
        location / {
            proxy_pass http://application;

            #for Signalr(websocket)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Configure ServerSentEvents
            proxy_buffering off;

            # Configure LongPolling
            proxy_read_timeout 100s;
        }
    }
}
